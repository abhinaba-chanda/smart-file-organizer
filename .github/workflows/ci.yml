name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install ".[dev]"
      - name: Test
        run: pytest -q
      - name: Smoke test the organize command
        shell: bash
        run: |
          python examples/make_messy_folder.py demo-downloads
          organize preview demo-downloads
          organize run demo-downloads --yes
          organize undo demo-downloads
