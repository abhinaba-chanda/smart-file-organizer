name: Release (Windows .exe)

on:
  push:
    tags: ["V*", "v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (must already exist)"
        required: true
        default: "V01"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build SmartFileOrganizer.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --console
          --name SmartFileOrganizer
          --icon packaging/icon.ico
          --paths src
          --collect-data smart_organizer
          --collect-submodules rich
          packaging/launcher.py

      - name: Smoke test the exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path dist\SmartFileOrganizer.exe
          & $exe --version; if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          & $exe --help;    if ($LASTEXITCODE -ne 0) { throw "--help failed" }
          $demo = Join-Path $env:RUNNER_TEMP "demo-downloads"
          python examples/make_messy_folder.py $demo
          & $exe preview $demo; if ($LASTEXITCODE -ne 0) { throw "preview failed" }
          if (-not (Test-Path (Join-Path $demo "song.mp3"))) { throw "preview moved files" }
          & $exe run $demo --yes; if ($LASTEXITCODE -ne 0) { throw "run failed" }
          if (Test-Path (Join-Path $demo "song.mp3")) { throw "run did not move song.mp3" }
          & $exe undo $demo; if ($LASTEXITCODE -ne 0) { throw "undo failed" }
          if (-not (Test-Path (Join-Path $demo "song.mp3"))) { throw "undo did not restore song.mp3" }
          Write-Host "Smoke test passed"

      - name: Package zip, checksums and release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\SmartFileOrganizer.exe out\
          $zip = "out\SmartFileOrganizer-$env:TAG-windows-x64.zip"
          Compress-Archive -Path dist\SmartFileOrganizer.exe, README.md, LICENSE -DestinationPath $zip -Force
          $lines = Get-ChildItem out -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $lines | Set-Content -Encoding ascii out\SHA256SUMS.txt
          $exeHash = (Get-FileHash out\SmartFileOrganizer.exe -Algorithm SHA256).Hash.ToLower()
          $exeSize = "{0:N1} MB" -f ((Get-Item out\SmartFileOrganizer.exe).Length / 1MB)
          $notes = Get-Content -Raw packaging\RELEASE_NOTES.md
          $notes = $notes.Replace("{{TAG}}", $env:TAG).Replace("{{SHA256}}", $exeHash).Replace("{{SIZE}}", $exeSize)
          $notes | Set-Content -Encoding utf8 out\notes.md
          Get-Content out\SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: out/notes.md
          make_latest: true
          files: |
            out/SmartFileOrganizer.exe
            out/SmartFileOrganizer-${{ env.TAG }}-windows-x64.zip
            out/SHA256SUMS.txt
