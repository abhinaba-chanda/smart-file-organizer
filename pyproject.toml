[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-file-organizer"
version = "1"  # the app calls this version V1
description = "Tidy a messy folder (like Downloads) by type and date, with dry-run preview, undo, duplicate detection and YAML rules."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abhinaba Chanda" }]
keywords = ["file-organizer", "cli", "downloads", "duplicates", "rich"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Topic :: Utilities",
]
dependencies = ["rich>=13.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
gui = ["sv-ttk>=2.6"]  # Windows 11 look for the window (optional; plain ttk without it)

[project.scripts]
organize = "smart_organizer.cli:main"

[project.gui-scripts]
organize-gui = "smart_organizer.gui:main"

[project.urls]
Homepage = "https://github.com/abhinaba-chanda/smart-file-organizer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smart_organizer = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
